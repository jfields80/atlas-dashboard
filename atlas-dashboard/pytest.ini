[pytest]
# PTF-FACTORY-THROUGHPUT-HARDENING-001 -- test lanes.
#
# Lane markers are applied at collection by conftest.py from the committed
# membership table in scripts/pettripfinder/regression_lanes.py; nothing is
# marked by hand. Select a lane with -m, a market with --ptf-market <id>, or run
# a lane with scripts/pettripfinder/regression_lanes.py run --lane <lane>.
markers =
    ptf_market(market_id): the PetTripFinder market a test module is named for
    market_targeted: PetTripFinder lane -- a market's own modules plus the per-market contract rows
    policy_schema: PetTripFinder lane -- the policy record contract, readers and renderers
    identity_routing: PetTripFinder lane -- identity keys, partitions, geography, routing, ledgers
    release_contract: PetTripFinder lane -- per-market release contracts and market authorities
    cross_market: PetTripFinder lane -- one market's data never leaks into another
    assembly: PetTripFinder lane -- the site generator and the multi-market assembler
    deployment_architecture: PetTripFinder lane -- manifests, participation, authorizations, records
    full_regression: PetTripFinder lane -- every test
